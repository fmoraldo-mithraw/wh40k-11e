# mfm-cowork.yml — le versant « cowork » de l'automatisation MFM.
#
# Déclenché quand un nouveau dump MFM est poussé sur main (par le cron serveur
# editor/mfm/cron-mfm.sh, ou par un push manuel du dump). Lance l'agent Claude
# qui intègre les changements de points dans la bdd et ouvre une PR :
# les deltas sûrs sont appliqués mécaniquement, le résidu (A_RENVOYER) est
# traité quand la donnée le permet, le reste est listé dans la PR.
#
# Prérequis (une fois) : secret ANTHROPIC_API_KEY (ou CLAUDE_CODE_OAUTH_TOKEN)
# dans Settings → Secrets and variables → Actions.
name: MFM cowork
on:
  push:
    branches: [main]
    paths:
      - "editor/mfm/dump/en/*.json"
  workflow_dispatch: {}

concurrency:
  group: mfm-cowork
  cancel-in-progress: false

jobs:
  integrer:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', '[skip cowork]') }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Intégration MFM par l'agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 300"
          prompt: |
            Un nouveau dump MFM vient d'être poussé dans editor/mfm/dump/en/
            (commit ${{ github.sha }}). Ta mission : intégrer les changements
            de points dans les fichiers .cat de CE dépôt et ouvrir une PR.

            RÉFÉRENCES À LIRE D'ABORD (elles font autorité) :
            - CLAUDE.md (règles maison, dont la forme NATIVE du prix par
              répétition et la validation obligatoire) ;
            - editor/mfm/README.md (la chaîne build-map/apply, les garde-fous) ;
            - editor/MFM_PROMPT.md (l'encodage des points : base, paliers,
              répétition, améliorations, surcoûts par arme) ;
            - editor/AGENTS_DUAL_COST_PROMPT.md (Agents of the Imperium :
              chaque unité apparaît DEUX fois dans le MFM — armée/alliés) ;
            - editor/MARINE_CHAPTER_COST_PROMPT.md s'il existe, sinon
              editor/MARINE_CHAPTER_COST_APP_PROMPT.md (coûts de chapitre :
              JAMAIS d'écriture brute sur un bsId partagé à prix divergent).

            MÉTHODE :
            1. `node editor/mfm/apply.mjs editor/mfm/dump/en` (dry-run) pour
               obtenir les DELTAS AUTO-APPLICABLES et le bloc « À ME
               RENVOYER » (aussi dans editor/mfm/A_RENVOYER.md). Si les
               matrices manquent ou sont périmées, régénère-les d'abord
               (`node editor/mfm/build-map.mjs editor/mfm/dump/en`) — si le
               parseur de l'app est absent, note-le dans la PR et continue
               avec les matrices commitées.
            2. Applique les deltas AUTO via editor/lib/catalog.js UNIQUEMENT
               (jamais de sed/regex sur les .cat) : coût de base, paliers de
               taille, prix par répétition (forme native increment+atLeast),
               points d'améliorations.
            3. Traite ce que tu peux du bloc « À ME RENVOYER » quand la
               donnée en base suffit à trancher ; liste le reste tel quel
               dans la PR (n'invente jamais une valeur douteuse).
            4. EXCEPTION ORKS : n'applique PAS un MFM de version ≤ v1.3 aux
               Orks (le codex en base est plus récent que ce MFM). Un MFM
               plus récent (v1.4+) s'applique normalement.
            5. Validation obligatoire avant tout commit :
               `node editor/audit/valider.mjs` (0 erreur, 0 id dupliqué
               nouveau). Ne committe JAMAIS un état non validé.
            6. Crée une branche `mfm/integration-<version>` et ouvre une PR
               vers main. Corps de PR : version du MFM, nombre de deltas
               appliqués par faction, ce qui a été traité du résidu, et la
               liste exacte de ce qui reste à faire à la main.
            7. Si le diff ne montre AUCUN changement de points à appliquer
               (dump identique côté valeurs), n'ouvre pas de PR — termine en
               l'expliquant dans le log.

            Messages de commit en français, descriptifs, un commit par lot
            cohérent (ou par faction si le volume le justifie).
